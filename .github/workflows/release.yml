name: Build & Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-linux:
    name: Build Multi-Platform Linux Packages (AppImage, DEB, RPM, Arch, Tarball)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies (GTK4, Libadwaita, MinGW-w64, RPM, librsvg, zstd)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libgtk-4-dev \
            libadwaita-1-dev \
            gcc-mingw-w64-x86-64 \
            gcc-mingw-w64-i686 \
            rpm \
            librsvg2-bin \
            squashfs-tools \
            zstd

      - name: Install Rust stable toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo registry & build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Build release binary & embedded Windows CNG shims
        run: cargo build --release --locked

      - name: Build all platform packages
        run: |
          chmod +x packaging/build_all.sh
          ./packaging/build_all.sh

      - name: Verify all release packages and checksums
        run: |
          VERSION=$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["package"]["version"])')
          for file in \
            goley-revival-linux-x86_64.AppImage \
            goley-revival-linux-x86_64.tar.gz \
            "goley-revival-linux_${VERSION}_amd64.deb" \
            "goley-revival-linux-${VERSION}-1-x86_64.pkg.tar.zst" \
            "goley-revival-linux-${VERSION}-1.x86_64.rpm"; do
            test -s "dist/$file"
            test -s "dist/$file.sha256"
          done
          cd dist
          sha256sum --check SHA256SUMS.txt

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: goley-revival-linux-packages
          path: dist/*

      - name: Publish GitHub Release (on tag push)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/*
