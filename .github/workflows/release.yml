name: Build & Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-linux:
    name: Build Linux x86_64 (GTK4 + Libadwaita + ncrypt shims)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install GTK4, Libadwaita & MinGW-w64 dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libgtk-4-dev \
            libadwaita-1-dev \
            gcc-mingw-w64-x86-64 \
            gcc-mingw-w64-i686

      - name: Install Rust stable toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo registry & build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Build release binary & embedded Windows CNG shims
        run: cargo build --release --locked

      - name: Package release archive
        run: |
          mkdir -p dist-pkg
          cp target/release/goley-revival-linux dist-pkg/
          cp assets/io.github.fuwia.GoleyRevivalLinux.desktop dist-pkg/
          cp assets/io.github.fuwia.GoleyRevivalLinux.svg dist-pkg/
          cp assets/io.github.fuwia.GoleyRevivalLinux.metainfo.xml dist-pkg/
          cp install.sh uninstall.sh LICENSE README.md dist-pkg/
          ./ncrypt-shim/build.sh dist-pkg/shims
          tar -czvf goley-revival-linux-x86_64.tar.gz -C dist-pkg .
          sha256sum goley-revival-linux-x86_64.tar.gz > goley-revival-linux-x86_64.tar.gz.sha256

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: goley-revival-linux-x86_64
          path: |
            goley-revival-linux-x86_64.tar.gz
            goley-revival-linux-x86_64.tar.gz.sha256

      - name: Publish GitHub Release (on tag push)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            goley-revival-linux-x86_64.tar.gz
            goley-revival-linux-x86_64.tar.gz.sha256
