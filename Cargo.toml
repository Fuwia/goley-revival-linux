[package]
name = "goley-revival-linux"
version = "0.1.8"
edition = "2021"
authors = ["Fuwia"]
description = "Goley Revival için doğal GTK4 + Libadwaita Linux başlatıcısı (An Anime Game Launcher / Faugus tarzı)"
license = "GPL-3.0-or-later"
repository = "https://github.com/Fuwia/goley-revival-linux"
keywords = ["goley", "revival", "linux", "launcher", "gtk4"]
categories = ["games", "gui"]

[dependencies]
gtk = { version = "0.9", package = "gtk4", features = ["v4_12"] }
adw = { version = "0.7", package = "libadwaita", features = ["v1_5"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
hex = "0.4"
dirs = "5.0"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
async-channel = "2.3"

[profile.release]
opt-level = 3
lto = "thin"
strip = true
codegen-units = 1
